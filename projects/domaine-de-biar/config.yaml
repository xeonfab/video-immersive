# Gabarit de configuration projet — un fichier par hôtel.
# Copié automatiquement par scripts/new_project.py dans projects/<slug>/config.yaml

hotel:
  nom: "Domaine de Biar"
  slug: "domaine-de-biar"          # utilisé pour le dossier et les noms de fichiers
  categorie: "4 étoiles"          # "4 étoiles" | "5 étoiles"
  localisation: "Ville, Région"
  site_web: ""
  logo_fichier: ""                 # chemin vers le fichier logo si fourni

positionnement:
  ambiance: "chillout haut de gamme"   # ex: "épuré minéral", "chaleureux boisé"
  mots_cles: ["sérénité", "authenticité", "vue mer"]
  reference_visuelle: ""               # une phrase décrivant le style photo existant

photos:
  instagram_url: ""                    # compte Instagram de l'hôtel
  dossier_brut: ""                     # dossier LOCAL du scrape, si applicable
  # Dossier Drive alimenté par le scénario Make "Apify → photos → Google Drive",
  # toujours créé À L'INTÉRIEUR du dossier parent partagé du studio
  # "Videos_immersives" (id 1kDhEW9gV4UbEUG18eX8WVYeH7pJdtDqm,
  # https://drive.google.com/drive/folders/1kDhEW9gV4UbEUG18eX8WVYeH7pJdtDqm)
  # — jamais à la racine du Drive.
  google_drive_folder: "domainedebiar (10u9c8sE2UZRufuR7ivIqmkA9U4nCzv3Y)"  # NB: hors du dossier parent Videos_immersives, à harmoniser plus tard
  make_scenario_id: ""                 # id du scénario Make correspondant (optionnel, pour référence)
  # projects/<slug>/photos-source/ est rempli automatiquement par le skill
  # selection-photos à partir de dossier_brut ou google_drive_folder —
  # ne pas éditer à la main.

contact_commercial:
  nom: ""
  role: ""                              # Directeur Général / Marketing / Communication
  email: ""
  premier_contact_le: ""
  statut: "a_contacter"                 # a_contacter | contacte | relance | rdv_obtenu | signe | perdu

production:
  nb_plans_prevus: 5
  duree_par_plan_sec: "4-5"
  duree_musique_sec: 24
  outil_video: "Runway Gen-3"           # ou "Kling" — indicatif, la génération réelle passe par Artlist (skill realisateur-ia)
  outil_montage: "CapCut"
  # Chemin LOCAL (propre à la machine) vers le dossier Drive de cet hôtel,
  # tel que synchronisé par Google Drive pour ordinateur. Renseigné une fois
  # par le skill realisateur-ia, qui y dépose ensuite directement les rushes
  # et le son générés (sous-dossier "Rushes & Sons IA") sans passer par un
  # upload MCP — les fichiers sont trop volumineux pour ça.
  drive_local_sync_path: ""

livraison:
  format_hebergement: "page Notion privée"   # ou "lien vidéo non répertorié, téléchargement désactivé"
  filigrane: false
